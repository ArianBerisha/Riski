<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef3f8"><meta name="description" content="Bilingual evidence-based mobility risk twin prototype"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>RiskAI</title></head><body><div id="toast" hidden></div><div class="shell"><aside><div class="brand"><b>R</b><div><strong>RiskAI</strong><small>Evidence-based Risk Twin</small></div></div><nav><button data-view="today" class="active" data-t="navToday"></button><button data-view="profiles" data-t="navProfiles"></button><button data-view="calendar" data-t="navCalendar"></button><button data-view="history" data-t="navHistory"></button><button data-view="evidence" data-t="navEvidence"></button><button id="methodBtn" data-t="navMethod"></button></nav><footer><b>v3.0 Full</b><small data-t="prototype"></small></footer></aside><main><header><div><small>PERSONAL RISK TWIN</small><h1 data-t="title"></h1><p data-t="subtitle"></p></div><div class="head"><button id="lang">EN</button><span data-t="loaded"></span></div></header>
<section id="today" class="view"><div class="toolbar"><button id="applyProfile" class="secondary" data-t="applyProfile"></button><button id="add" class="primary" data-t="addActivity"></button></div><div class="layout"><div class="card"><h2 data-t="activities"></h2><div id="activities"></div><div id="empty" class="empty" data-t="empty"></div></div><div class="card resultCard"><div class="result"><div><small data-t="quantified"></small><h2><span id="mm">0.0000</span> <b>µMort</b></h2></div><span id="band" class="pill green"></span></div><div class="scale"><i id="needle"></i></div><div class="labels"><span>0</span><span>0.1</span><span>1</span><span>10</span><span>100</span></div><div class="facts"><div><small data-t="probability"></small><b id="prob">0</b></div><div><small data-t="quality"></small><b id="tier">–</b></div><div><small data-t="coverage"></small><b id="coverage">0 / 0</b></div></div><div id="warning"></div><div id="recommendations"></div><div class="bar"><h3 data-t="contributions"></h3><div><button id="saveDay" class="link" data-t="saveDay"></button><button id="exportDay" class="link">JSON</button></div></div><div id="parts"></div><details><summary data-t="details"></summary><pre id="formula"></pre><div id="detailsBody"></div></details></div></div></section>
<section id="profiles" class="view" hidden><div class="layout"><div class="card"><div class="bar"><div><h2 data-t="profilesTitle"></h2><p data-t="profilesIntro"></p></div><button id="newProfile" class="primary" data-t="newProfile"></button></div><div id="profileList"></div></div><div class="card"><div id="profileEditor" class="empty" data-t="selectProfile"></div></div></div></section>
<section id="calendar" class="view" hidden><div class="card"><div class="bar"><div><h2 data-t="calendarTitle"></h2><p data-t="calendarIntro"></p></div><label><input id="autoApply" type="checkbox"> <span data-t="automatic"></span></label></div><div class="month"><button id="prev">‹</button><h2 id="monthLabel"></h2><button id="next">›</button></div><div id="calendarGrid" class="calendarGrid"></div><div id="exceptionEditor" class="empty" data-t="selectDate"></div></div></section>
<section id="history" class="view" hidden><div class="card"><div class="bar"><h2 data-t="historyTitle"></h2><button id="clearHistory" class="danger" data-t="clear"></button></div><div id="historyList"></div></div></section>
<section id="evidence" class="view" hidden><div class="card"><div class="bar"><div><h2 data-t="evidenceTitle"></h2><p data-t="evidenceIntro"></p></div><select id="evidenceFilter"><option value="all" data-t="all"></option><option value="active" data-t="activeOnly"></option><option value="open" data-t="openOnly"></option></select></div><div id="evidenceSummary" class="summary"></div><div id="evidenceGrid" class="egrid"></div></div></section></main></div><button id="aiFab">✦</button>
<dialog id="picker"><button class="close">×</button><h2 data-t="chooseMode"></h2><div id="pickGrid" class="pickgrid"></div></dialog><dialog id="ai"><button class="close">×</button><h2>Risk Copilot Preview</h2><div id="aiMessages" class="messages"></div><div class="quick"><button data-ai="summary" data-t="explain"></button><button data-ai="coverage" data-t="gaps"></button><button data-ai="recommendations" data-t="actions"></button><button data-ai="profile" data-t="profileOrigin"></button></div></dialog><dialog id="method"><button class="close">×</button><h2 data-t="methodTitle"></h2><p class="equation">H<sub>day</sub> = Σ q<sub>i</sub> · ρ<sub>i</sub> · M<sub>context</sub> · B<sub>barriers</sub></p><p data-t="methodText"></p></dialog><script src="app.js"></script></body></html>
